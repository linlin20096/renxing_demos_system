<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>韧小行 · 情绪捕手</title>
<style>
:root{
  --ink:#0f172a;
  --ink2:#334155;
  --ink3:#64748b;
  --ink4:#94a3b8;
  --line:#e2e8f0;
  --line-soft:#f1f5f9;
  --surface:#f8fafc;
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --blue-soft:#eff6ff;
  --blue-line:#bfdbfe;
  --green:#10b981;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 根容器：锁死视口高度 + 禁止页面级双重滚动
   （移动端全屏外壳的标准写法，骨架取自"学生端修改1"） */
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#eef2f7;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;
  padding:20px 20px 24px;gap:14px;
  -webkit-font-smoothing:antialiased;
}

/* ══════════ 演示控制条（在应用之外，录屏可裁掉） ══════════ */
.ctrl{width:100%;max-width:1120px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ctrl .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.ctrl .seg button{
  border:0;background:transparent;padding:7px 14px;border-radius:7px;
  font-size:13.5px;color:var(--ink3);cursor:pointer;font-family:inherit;white-space:nowrap;
  transition:background .15s,color .15s;
}
.ctrl .seg button.on{background:var(--blue-soft);color:var(--blue);font-weight:700}
.ctrl .btn{
  border:1px solid #dbe3ec;background:#fff;color:var(--ink2);
  padding:8px 15px;border-radius:10px;font-size:13.5px;font-weight:600;
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;
}
.ctrl .btn:hover{border-color:var(--blue);color:var(--blue)}
.ctrl .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.ctrl .btn.primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}

/* ══════════ 页脚 ══════════ */
.foot{
  flex:0 0 auto;width:100%;max-width:1120px;
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:11.5px;color:var(--ink4);user-select:none;
}
.foot .by{opacity:.55;letter-spacing:.3px}
.foot .key{
  width:9px;height:9px;border-radius:50%;background:var(--ink4);
  opacity:.22;cursor:default;transition:opacity .2s;
  touch-action:manipulation;   /* 否则 iOS 上快速两下会触发双击缩放，第三下点不到 */
}
.foot .key.armed{opacity:.45}

/* ══════════ 应用窗口 ══════════ */
.app{
  width:100%;max-width:1120px;
  flex:1 1 0%;min-height:0;max-height:900px;  /* 撑满剩余高度，大屏封顶 900 */
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 12px 32px rgba(0,0,0,.06);
}

/* 顶栏 */
.hd{
  flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);
  padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.hd-l{display:flex;align-items:center;gap:9px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 8px}
.hd .name{font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap}
.hd .tag{
  font-size:11px;font-weight:600;background:var(--blue-soft);color:var(--blue);
  border:1px solid var(--blue-line);padding:2px 8px;border-radius:4px;white-space:nowrap;
}
.hd .sid{font-size:12px;color:var(--ink4);white-space:nowrap}

/* 主体 */
.bd{flex:1;min-height:0;display:flex}

/* 侧栏（仅电脑端） */
.side{
  flex:0 0 248px;border-right:1px solid var(--line);
  padding:18px 16px 24px;overflow-y:auto;background:#fbfcfe;
  display:flex;flex-direction:column;gap:14px;
}
.scard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.sh{font-size:12.5px;font-weight:700;color:var(--ink3);letter-spacing:.5px;margin-bottom:11px}
.kv{display:flex;gap:10px;font-size:13.5px;line-height:1.6;padding:3px 0}
.kv .k{flex:0 0 46px;color:var(--ink4)}
.kv .v{flex:1;color:var(--ink2);font-weight:600}
.goal{font-size:13.5px;line-height:1.7;color:var(--ink2)}
.pbar{height:8px;background:#eef2f7;border-radius:5px;overflow:hidden;margin-bottom:9px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#60a5fa);border-radius:5px;transition:width .35s ease}
.ptx{font-size:12.5px;color:var(--ink4);font-variant-numeric:tabular-nums}

/* 对话区 */
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.msgs{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:20px;
  padding:26px max(26px,calc((100% - 720px) / 2));
}
.msgs::-webkit-scrollbar{width:8px}
.msgs::-webkit-scrollbar-thumb{background:#dbe3ec;border-radius:4px}
.msgs::-webkit-scrollbar-track{background:transparent}

/* 一键选择托盘（内置情绪词汇库 / 身体部位图，也可自由输入） */
.tray{
  flex:0 0 auto;background:#fff;
  display:flex;flex-wrap:wrap;align-items:center;gap:7px;
  padding:0 max(26px,calc((100% - 720px) / 2)) 10px;
}
.tray:empty{display:none}
.tray .traylb{font-size:12px;color:var(--ink4);margin-right:1px;white-space:nowrap}
.tray .chip{
  border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue);
  border-radius:999px;padding:5px 13px;font-size:13px;line-height:1.5;
  cursor:pointer;font-family:inherit;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.tray .chip:hover{background:#dbeafe}
.tray .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* 消息 */
.mrow{display:flex;width:100%;align-items:flex-start}
.mrow.ai{flex-direction:row}
.mrow.me{flex-direction:row-reverse}
.avatar{
  width:38px;height:38px;flex:0 0 38px;border-radius:8px;object-fit:cover;
  background:#e2e8f0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:var(--ink3);overflow:hidden;
}
.avatar.av-txt{background:var(--blue-soft);color:var(--blue)}
.avatar.av-me{background:var(--line-soft);color:var(--ink3)}

.mwrap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.mrow.ai .mwrap{align-items:flex-start;margin-left:14px}
.mrow.me .mwrap{align-items:flex-end;margin-right:12px}

.sname{font-size:13px;color:var(--ink3);font-weight:500;margin-left:2px}
.mrow.me .sname{margin-left:0;margin-right:2px}

.bubble{
  width:fit-content;max-width:76%;
  padding:11px 15px;border-radius:10px;
  font-size:14.5px;line-height:1.62;word-break:break-word;
}
.mrow.ai .bubble{
  background:#fff;border:1px solid var(--line);color:#1e293b;
  border-top-left-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.03);
}
.mrow.me .bubble{
  background:var(--blue);color:#fff;
  border-top-right-radius:2px;box-shadow:0 2px 8px rgba(37,99,235,.15);
}

/* 正在输入 */
.typing .bubble{display:flex;align-items:center;gap:5px;padding:14px 16px}
.typing .bubble i{width:6px;height:6px;border-radius:50%;background:#cbd5e1;display:block;animation:tp 1.1s infinite}
.typing .bubble i:nth-child(2){animation-delay:.18s}
.typing .bubble i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* 系统卡 */
.sys{align-self:center;width:100%;max-width:600px}
.sys .card{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;font-size:13.5px;line-height:1.7;color:var(--ink2);
  box-shadow:0 2px 6px rgba(0,0,0,.03);
}
.sys .card .h{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:9px}
.sys .card .kvr{display:flex;justify-content:space-between;gap:14px;padding:3.5px 0}
.sys .card .kvr .k{color:var(--ink4);flex:0 0 auto}
.sys .card .kvr .v{font-weight:600;color:var(--ink2);text-align:right}
.sys .card .op{margin-top:4px;color:var(--ink2)}
.sys .card .note{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  color:var(--ink2);
}
.sys .card .note b{color:var(--blue)}
.sys.warn .card{background:#fffbeb;border-color:#fde68a}
.sys.warn .card .h{color:#b45309}
.sys.stop .card{background:#fef2f2;border-color:#fecaca}
.sys.stop .card .h{color:#b91c1c}
.sys.done .card{background:#f0fdf4;border-color:#bbf7d0}
.sys.done .card .h{color:#15803d}

/* 对话里的七日日历已改为文字版（见 .sys .card .tcal） */

/* 输入区 */
.composer{
  flex:0 0 auto;background:#fff;border-top:1px solid var(--line);
  padding:14px max(26px,calc((100% - 720px) / 2));
  display:flex;align-items:center;gap:10px;
}
.composer input{
  flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;
  padding:0 15px;font-size:14.5px;font-family:inherit;color:var(--ink);
  background:#fbfcfe;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
}
.composer input:focus{border-color:var(--blue-line);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.composer input::placeholder{color:var(--ink4)}
.composer input:disabled{background:var(--line-soft);color:var(--ink4)}
.composer .send{
  flex:0 0 auto;height:44px;padding:0 24px;border:0;border-radius:10px;cursor:pointer;
  background:var(--blue);color:#fff;font-size:14.5px;font-weight:600;font-family:inherit;
  box-shadow:0 2px 8px rgba(37,99,235,.2);transition:background .15s;
}
.composer .send:hover{background:var(--blue-dark)}
.composer .send:disabled{background:#cbd5e1;box-shadow:none;cursor:default}

/* ══════════════════════════════════════════════
   七日打卡表（可自由点，仅「情绪捕手打卡」场景显示）
   点一下＝完成当天任务；再点一下取消。
   刻意不做成线性向导 —— 教师现场想点哪天点哪天。
   ══════════════════════════════════════════════ */
.wk{
  flex:0 0 auto;background:#fff;border-top:1px solid var(--line);
  padding:0 max(26px,calc((100% - 720px) / 2));
  display:none;
}
.wk.show{display:block}
.wk .wk-in{padding:12px 0 14px}
.wk .wk-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.wk .wk-t{font-size:13px;font-weight:700;color:var(--ink2)}
.wk .wk-p{font-size:12.5px;color:var(--ink4);font-variant-numeric:tabular-nums}
.wk .wk-p b{color:var(--blue);font-size:15px}
.wk .wk-cal{letter-spacing:1px;margin-right:9px;font-size:11.5px}

/* 对话里的文字日历（这就是平台上真正跑得通的形态） */
.sys .card .tcal{
  margin-top:11px;font-size:16px;letter-spacing:2px;line-height:1.4;
  font-variant-numeric:tabular-nums;
}
.wk .wk-days{display:flex;gap:7px}
.wk .wk-d{
  flex:1;min-width:0;height:54px;border-radius:10px;cursor:pointer;font-family:inherit;
  background:#f8fafc;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:background .18s,border-color .18s,box-shadow .18s,transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.wk .wk-d:hover{border-color:var(--blue-line);background:var(--blue-soft)}
.wk .wk-d:active{transform:scale(.94)}
.wk .wk-d i{font-style:normal;font-size:16px;font-weight:700;color:#cbd5e1;line-height:1}
.wk .wk-d em{font-style:normal;font-size:10.5px;color:var(--ink4);line-height:1;white-space:nowrap}
.wk .wk-d.on{background:var(--blue);border-color:var(--blue);box-shadow:0 3px 10px rgba(37,99,235,.25)}
.wk .wk-d.on i{color:#fff}
.wk .wk-d.on em{color:rgba(255,255,255,.82)}
.wk .wk-done{
  display:none;margin-top:10px;font-size:12.5px;line-height:1.6;color:#15803d;
  background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 12px;
}
.wk .wk-done.show{display:block}

/* ══════════════════════════════════════════════
   手机端：同一份文件，切换成手机布局
   骨架＝「学生端修改1」（锁高度 + flex 撑满），
   字号/间距仍用本版（投屏录课看得清）
   ══════════════════════════════════════════════ */
@media(max-width:900px){
  body{
    display:flex;flex-direction:column;align-items:stretch;
    height:100dvh;min-height:0;overflow:hidden;
    padding:0;gap:0;background:var(--surface);
  }
  .ctrl{
    flex:0 0 auto;max-width:none;width:100%;
    padding:7px 10px;gap:7px;
    background:#e9eef5;border-bottom:1px solid #dbe3ec;
  }
  .ctrl .seg{padding:2px}
  .ctrl .seg button{padding:6px 11px;font-size:12.5px}
  .ctrl .btn{padding:6px 12px;font-size:12.5px}

  .app{
    flex:1 1 0%;min-height:0;height:auto;max-height:none;
    max-width:none;width:100%;
    border:0;border-radius:0;box-shadow:none;
  }
  .hd{background:#eef4ff;border-bottom-color:#e3ecfb;padding:13px 15px}
  .hd .sid{display:none}
  .side{display:none}

  .msgs{padding:16px 14px 20px;gap:16px}
  .msgs::-webkit-scrollbar{width:0}
  .tray{padding:0 12px 8px;gap:6px}
  .tray .chip{padding:5px 11px;font-size:12.5px}
  .mwrap{margin-left:10px !important;margin-right:9px !important}
  .sname{display:none}
  .bubble{font-size:15px;max-width:80%}
  .avatar{width:34px;height:34px;flex:0 0 34px}
  .sys{max-width:none}
  .sys .card{font-size:13px;padding:13px 14px}

  .wk{padding:0 12px}
  .wk .wk-in{padding:10px 0 12px}
  .wk .wk-days{gap:5px}
  .wk .wk-d{height:50px;border-radius:9px}
  .wk .wk-d i{font-size:15px}
  .wk .wk-d em{font-size:9.5px}

  /* 安全区留白从输入框挪到页脚：页脚现在才是页面最底部那个元素 */
  .composer{padding:10px 12px;gap:8px}
  /* 必须 ≥16px：iOS Safari 对 font-size<16px 的输入框，聚焦时会自动放大整页，破掉 100dvh 锁定 */
  .composer input{height:42px;font-size:16px}
  .composer .send{height:42px;padding:0 18px;font-size:15px}

  .foot{max-width:none;font-size:10.5px;gap:10px;
        padding-bottom:calc(env(safe-area-inset-bottom,0px) + 5px)}
  .foot .key{width:20px;height:20px;background:transparent;position:relative}
  .foot .key::after{
    content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:9px;height:9px;border-radius:50%;background:var(--ink4);opacity:.22;
  }
  .foot .key.armed::after{opacity:.45}
}
</style>
</head>
<body>

<!-- 演示控制条（不属于应用界面本身） -->
<div class="ctrl">
  <div class="seg" id="seg">
    <button data-k="ice" class="on">AI 冰山引导师</button>
    <button data-k="worker">AI 工地工人</button>
    <button data-k="checkin">情绪捕手打卡</button>
  </div>
  <button class="btn primary" id="btnAuto">⚡ 一键填充</button>
  <button class="btn" id="btnReplay">↺ 重播</button>
</div>

<!-- 应用窗口 -->
<div class="app">

  <header class="hd">
    <div class="hd-l">
      <span class="dot"></span>
      <span class="name">韧小行</span>
      <span class="tag" id="hdTag">AI 冰山引导师</span>
    </div>
    <span class="sid">对话记录 ID：#2026-XL-0917</span>
  </header>

  <div class="bd">
    <aside class="side" id="side"></aside>

    <main class="chat">
      <div class="msgs" id="msgs"></div>

      <!-- 七日打卡表（仅「情绪捕手打卡」场景显示） -->
      <div class="wk" id="wk">
        <div class="wk-in">
          <div class="wk-hd">
            <span class="wk-t">情绪捕手 · 七日打卡</span>
            <span class="wk-p"><span class="wk-cal" id="wkCal">⬜️⬜️⬜️⬜️⬜️⬜️⬜️</span> 已完成 <b id="wkN">0</b> / 7 天</span>
          </div>
          <div class="wk-days" id="wkDays"></div>
          <div class="wk-done" id="wkDone">🎉 七日全勤！AI 周报已生成 —— 7 天情绪趋势、高频身体部位、冰山探索深度已汇总。</div>
        </div>
      </div>

      <div class="tray" id="tray"></div>
      <div class="composer">
        <input id="inp" type="text" placeholder="输入你的回应…" autocomplete="off">
        <button class="send" id="send">发送</button>
      </div>
    </main>
  </div>

</div>

<!-- 页脚。小圆点是教师端入口：连点 3 次进（见脚本末尾） -->
<div class="foot">
  <span class="by">design by yulinlin</span>
  <span class="key" id="key"></span>
</div>

<script>
/* ══════════════════════════════════════════════
   数据：台词全部取自《教案1 情绪管理上》原文
   ══════════════════════════════════════════════ */
const SCENES = {

  /* ── 润心环节：AI冰山引导师一对一追问 ── */
  ice: {
    aiFirst : true,
    tag     : 'AI 冰山引导师',
    sname   : '韧小行',
    role    : 'AI 冰山引导师',
    stage   : '润心 · 一对一追问',
    goal    : '从表层「愤怒」出发，逐层追问到冰山深处的「渴望」',
    task    : null,
    total   : 8,
    script  : [
      {who:'ai', t:'同学，刚才听你说完，我注意到一个细节——你说“忍不住发了火”，然后马上又说“事后很后悔”。你那个“忍不住”的瞬间，身体里发生了什么？'},
      {who:'me', t:'就是……胸口一股气直接冲上来了，脑子一热，话就出去了。'},
      {who:'ai', t:'嗯，那股气冲上来的时候，你脑子里闪过的第一个念头是什么？'},
      {who:'me', t:'就是觉得——又改？又改？我都改了三版了！'},
      {who:'ai', t:'好，那我们停在这儿。你刚才说的“又改”，那个情绪叫愤怒，对吧？'},
      {who:'me', t:'对，就是愤怒，特别愤怒。'},
      {who:'ai', t:'好。现在我想请你做一件事——就只是看着那个愤怒，然后我问你，愤怒下面是什么？'},
      {who:'me', t:'好像不只是愤怒。有点委屈？'},
      {who:'ai', t:'委屈。你说说看，那个委屈是什么感觉？'},
      {who:'me', t:'就是我觉得我已经很努力了，三版方案每一版我都认真做了，我熬夜改的。但他好像完全没看到我的付出，就轻飘飘一句“再调一下”。'},
      {who:'ai', t:'嗯，我听到了——“我努力了，但对方没看见”。那个委屈，你想让甲方知道什么？'},
      {who:'me', t:'想让他知道我不是随便应付的。我是认真的。还想让他知道……我不是他的手下，我不是随叫随到的，我也有我的专业判断。'},
      {who:'ai', t:'所以那个委屈真正想说的是——“请看见我的专业，请尊重我的劳动。”水面上是愤怒，水面下是渴望被尊重、被看见。'},

const $ = id => document.getElementById(id);
const msgsEl = $('msgs'), inpEl = $('inp'), sendEl = $('send');
const segEl = $('seg'), hdTag = $('hdTag'), sideEl = $('side'), trayEl = $('tray');
const wkEl = $('wk'), wkDaysEl = $('wkDays'), wkNEl = $('wkN'), wkDoneEl = $('wkDone'), wkCalEl = $('wkCal');

let auto = false;
let busy = false;
let typingEl = null;
let timers = [];
let livePushed = false;   // 幂等：同一轮演示只写一条实时记录

function after(ms, fn){
  const g = gen;
  const id = setTimeout(() => { if (g === gen) fn(); }, ms);
  timers.push(id);
}
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function scrollDown(){
  msgsEl.scrollTo({ top: msgsEl.scrollHeight, behavior:'smooth' });
}

/* 头像：图片加载失败自动退回文字方块 */
function avatar(src, txt, extraCls){
  const img = document.createElement('img');
  img.className = 'avatar' + (extraCls ? ' ' + extraCls : '');
  img.alt = txt;
  img.src = src;
  img.onerror = () => {
    const d = el('div','avatar av-txt' + (extraCls ? ' ' + extraCls : ''), txt);
    img.replaceWith(d);
  };
  return img;
}

/* ── 渲染一条内容 ── */
function addBubble(it){
  /* 动态节点：内容要按现场点到第几天来现算，不能写死 */
  if (it.dyn === 'close') it = { who:'ai', t: closeText() };
  else if (it.dyn === 'final') it = buildFinal();

  if (it.who === 'sys'){
    msgsEl.appendChild(sysCard(it));

  } else if (it.who === 'ai'){
    const row = el('div','mrow ai');
    row.appendChild(avatar('avatar-ren.png','韧'));
    const w = el('div','mwrap');
    w.appendChild(el('div','sname', S.sname));
    /* {echo} ＝ 复述学生刚说的那句，AI 不能自己说自己的 */
    w.appendChild(el('div','bubble', String(it.t).replace(/\{echo\}/g, cut(lastMe, 22) || '……')));
    row.appendChild(w);
    msgsEl.appendChild(row);

  } else {
    const row = el('div','mrow me');
    row.appendChild(avatar('avatar-stu.png','生','av-me'));
    const w = el('div','mwrap');
    w.appendChild(el('div','sname','学生'));
    w.appendChild(el('div','bubble', it.t));
    row.appendChild(w);
    msgsEl.appendChild(row);
    meDone++;
    updateProgress();
    lastMe = it.t;                              // 供下一句 AI 的 {echo} 复述
    if (it.slot) wkLog[it.slot] = it.t;         // 四件事记下来，收尾卡要用
  }
  scrollDown();
}

function sysCard(it){
  const box = el('div','sys' + (it.cls ? ' ' + it.cls : ''));
  const card = el('div','card');
  if (it.h) card.appendChild(el('div','h', it.h));
  if (it.kv){
    it.kv.forEach(p => {
      const r = el('div','kvr');
      r.appendChild(el('div','k', p[0]));
      r.appendChild(el('div','v', p[1]));
      card.appendChild(r);
    });
  }
  if (it.cal) card.appendChild(el('div','tcal', it.cal));   // 文字日历（答辩时讲的就是它）
  if (it.op) card.appendChild(el('div','op', it.op));
  if (it.note) card.appendChild(el('div','note', it.note));
  box.appendChild(card);
  return box;
}

function updateProgress(){

/* ── 一键选择托盘：只有带 chips 的脚本条目才显示 ── */
function renderTray(nx){
  const chips = (nx && nx.who === 'me' && nx.chips) || null;
  if (!chips || !chips.length){ trayEl.innerHTML = ''; return; }
  trayEl.innerHTML = '<span class="traylb">一键选择</span>'
    + chips.map(c => '<button class="chip" type="button">' + c + '</button>').join('');
}
trayEl.addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  [...trayEl.querySelectorAll('.chip')].forEach(x => x.classList.toggle('on', x === b));
  inpEl.value = b.textContent;
  inpEl.focus();

/* ── 七日打卡表 ──
   自由点：点一下＝完成当天任务，再点一下取消。
   不做线性约束，教师现场想点哪天点哪天。 */
const WK_LABEL = ['第1天','第2天','第3天','第4天','第5天','第6天','第7天'];
let wkOn = [false,false,false,false,false,false,false];

/* 对话里这轮记下的四件事（天气/身体/渴望/应对），收尾要用 */
let wkLog = { weather:'', body:'', want:'', cope:'' };
let lastMe = '';   // 学生最近一句原话，供 AI 的「{echo}」复述

/* ── 写给教师端的实时记录 ──
   注意：localStorage 是「按浏览器」隔离的，不是按服务器。
   所以只有【同一台电脑 + 同一个浏览器】开两个标签页时才读得到 ——
   手机打卡、电脑大屏看，是两台设备两个存储区，永远同步不了。 */
const LIVE_KEY = 'rjx_demo_live';

/* 探测必须真写一次：Safari 无痕模式下对象在、读也在，只有写会抛 */
function liveOK(){
  try{ localStorage.setItem('__rjx_t','1'); localStorage.removeItem('__rjx_t'); return true; }
  catch(e){ return false; }
}

function pushLive(v){
  try{
    const raw = JSON.parse(localStorage.getItem(LIVE_KEY) || '[]');
    const list = Array.isArray(raw) ? raw : [];
    list.unshift({
      v: 1, ts: Date.now(),
      day: v.n, bar: v.bar,
      weather: wkLog.weather, body: wkLog.body,
      want: wkLog.want, cope: wkLog.cope
    });
    localStorage.setItem(LIVE_KEY, JSON.stringify(list.slice(0, 20)));
  }catch(e){ /* 静默：演示优先，宁可不同步也绝不能让完成卡渲染不出来 */ }
}

function renderWeek(){
  wkDaysEl.innerHTML = WK_LABEL.map((lb, i) =>
    '<button class="wk-d' + (wkOn[i] ? ' on' : '') + '" type="button" data-d="' + i + '">'
    + '<i>' + (wkOn[i] ? '✓' : (i + 1)) + '</i><em>' + lb + '</em>'
    + '</button>').join('');
  const n = wkOn.filter(Boolean).length;
  wkNEl.textContent = n;
  wkCalEl.textContent = bar7(n);                // 标题栏的文字日历，跟格子同步
  wkDoneEl.classList.toggle('show', n === 7);   // 满 7 天才弹全勤条
}
function resetWeek(){ wkOn = [false,false,false,false,false,false,false]; renderWeek(); }

/* 文字日历：✅⬜️ 七格 */
function bar7(n){ return Array.from({length:7}, (_, i) => i < n ? '✅' : '⬜️').join(''); }

/* 当前算到第几天。
   total ＝ 真实点亮格数，是唯一事实来源；bar 永远跟它对齐，
   否则会出现「标题栏 0/7、完成卡却写第 1 天」的自相矛盾。 */
function wkInfo(){
  const total = wkOn.filter(Boolean).length;
  const n = Math.max(1, total);              // 讲"第几天"时至少算第 1 天
  return { n, total, left: 7 - n, bar: bar7(total) };
}

/* 掐短：去掉开头符号，截到第一个停顿，最多 16 字 */
function cut(s, n){
  s = String(s || '').trim();
  s = s.split(/[。，；！？,;!?]/)[0] || s;
  return s.length > (n || 16) ? s.slice(0, n || 16) + '…' : s;
}

/* AI 的收尾语：天数、日历、四件事全部按现场点的来 */
function closeText(){
  const v = wkInfo();

  /* 一格都没点亮：不能说"第 1 天"，否则和标题栏的 0/7 打架 */
  if (v.total === 0){
    return '今天先记到这儿 🌙<br><br>'
         + '你还没在上面点亮任何一格 —— <b>点一下「第 1 天」就完成今天的打卡。</b><br>'
         + '点亮之后，我会把今天这四件事连成一条线讲给你听。';
  }

  return '<b>第 ' + v.n + ' 天，收工 ✅</b><br><br>'
    + '把今天记的四件事连起来看：<br>'
    + '情绪上来时，身体先给了信号——<b>' + (cut(wkLog.body, 12) || '某个部位') + '</b>；'
    + '水面下真正想要的，是「<b>' + (cut(wkLog.want) || '被看见') + '</b>」；'
    + '而这一次，你用「<b>' + (cut(wkLog.cope, 12) || '暂停一下') + '</b>」接住了它。<br><br>'
    + '<b>识别 → 觉察 → 调节 → 归因，这一圈你自己走完了。</b><br><br>'
    + '七日轨迹：<span class="tcal">' + v.bar + '</span><br>'
    + (v.left > 0
        ? '已记录 <b>' + v.n + '</b> 天，还差 <b>' + v.left + '</b> 天。明天 21:00 我再来找你 🌙'
        : '<b>七日全勤。</b>但记住：<b>打卡不是比谁天数多，是比谁看得清。</b>');
}

/* 结尾那张完成卡：天数是真点出来的，不是写死的 7 */
function buildFinal(){
  const v = wkInfo();

  /* 一格都没点亮：不写实时记录，也不假装有天数 */
  if (v.total === 0){
    return {
      who:'sys', h:'📅 今天先记到这儿',
      kv: [
        ['情绪天气', cut(wkLog.weather, 18) || '—'],
        ['身体信号', cut(wkLog.body, 18) || '—'],
        ['冰山一层', cut(wkLog.want, 18) || '—'],
        ['应对方式', cut(wkLog.cope, 18) || '—']
      ],
      cal: v.bar,
      note:'<b>还没点亮打卡格。</b>在输入框上方点一下「第 1 天」，就完成今天的任务。'
    };
  }

  if (!livePushed){ pushLive(v); livePushed = true; }   // 写进本地存储，供教师端读

  const full = v.total === 7;
  return {
    who:'sys', cls: full ? 'done' : '',
    h: full ? '🎉 七日打卡已完成' : '📅 第 ' + v.n + ' 天打卡已记录',
    kv: [
      ['情绪天气', cut(wkLog.weather, 18) || '—'],
      ['身体信号', cut(wkLog.body, 18) || '—'],
      ['冰山一层', cut(wkLog.want, 18) || '—'],
      ['应对方式', cut(wkLog.cope, 18) || '—'],
      ['累计天数', v.n + ' / 7 天']
    ],
    cal: v.bar,
    note: full
      ? '<b>AI 周报已生成。</b>但真正算数的不是天数——是你今天挖到了水面下那一层「渴望」。'
      : '<b>还差 ' + v.left + ' 天。</b>打卡不是凑满 7 格，是让你下次再遇到同样的雷暴时，身体先知道、你叫得出它的名字。'
  };
}

wkDaysEl.addEventListener('click', e => {

function syncInput(){
  const nx = S.script[idx];
  renderTray(nx);
  if (nx && nx.who === 'me'){
    inpEl.value = nx.t;
    inpEl.disabled = false;
    sendEl.disabled = false;

    inpEl.value = '';
    inpEl.placeholder = '本轮对话已结束';
    inpEl.disabled = true;
    sendEl.disabled = true;
  } else {
    inpEl.value = '';
    inpEl.placeholder = '对方正在回应…';
    inpEl.disabled = true;
    sendEl.disabled = true;
  }
}

/* ── 初始化（幂等，重播不用刷新页面） ── */
function init(play){
  gen++;
  clearTimers();
  hideTyping();
  auto = false; busy = false; meDone = 0;

  S = SCENES[sceneKey];
  msgsEl.innerHTML = '';
  idx = 0;
  inpEl.value = '';
  inpEl.placeholder = '输入你的回应…';
  inpEl.disabled = false;
  sendEl.disabled = false;

  hdTag.textContent = S.tag;
  renderSide();

  /* 打卡表只在「情绪捕手打卡」场景出现，切走自动隐藏 */
  wkEl.classList.toggle('show', sceneKey === 'checkin');
  resetWeek();
  wkLog = { weather:'', body:'', want:'', cope:'' };
  lastMe = '';
  livePushed = false;   // 重播／切场景＝新一轮演示，允许再写一条

  if (S.aiFirst) addBubble(S.script[idx++]);
  syncInput();

  if (play) startAuto();
}

/* ── 逐条发送 ── */
function onSend(){
  const nx = S.script[idx];
  if (busy || auto || !nx || nx.who !== 'me') return;
  busy = true;
  idx++;
  trayEl.innerHTML = '';

  addBubble({ who:'me', t: inpEl.value.trim() || nx.t, slot: nx.slot });
  inpEl.value = '';
  inpEl.disabled = true;
  sendEl.disabled = true;

  after(700, runTail);
}

/* 学生说完后自动连播到下一个该学生说话的位置
   （中间若有 AI 回复就带“正在输入”，有系统卡就直接出） */
function runTail(){
  const nx = S.script[idx];
  if (!nx || nx.who === 'me'){ busy = false; syncInput(); return; }
  idx++;
  if (nx.who === 'ai'){
    showTyping();
    after(880, () => {
      hideTyping();
      addBubble(nx);
      after(420, runTail);
    });
  } else {
    addBubble(nx);
    after(560, runTail);
  }
}

/* ── 一键填充：自动跑完全程 ── */
function startAuto(){
  if (auto) return;
  auto = true;
  inpEl.disabled = true;
  sendEl.disabled = true;
  trayEl.innerHTML = '';

  const tick = () => {
    if (!auto) return;
    if (idx >= S.script.length){ auto = false; syncInput(); return; }
    const it = S.script[idx++];
    if (it.who === 'ai'){
      showTyping();
      after(780, () => {
        hideTyping();
        addBubble(it);
        inpEl.disabled = true; sendEl.disabled = true;
        after(640, tick);
      });
    } else {
      addBubble(it);
      inpEl.disabled = true; sendEl.disabled = true;
      after(640, tick);
    }
  };
  tick();
}

/* ── 交互绑定 ── */
segEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  [...segEl.children].forEach(x => x.classList.toggle('on', x === b));
  sceneKey = b.dataset.k;
  init(false);
});
$('btnAuto').onclick   = () => init(true);
$('btnReplay').onclick = () => init(false);
sendEl.onclick         = onSend;
inpEl.addEventListener('keydown', e => { if (e.key === 'Enter') onSend(); });

/* ── 教师端隐藏入口：页脚小圆点连点 3 次 ──
   1.2 秒滑动窗口内点满 3 下才放行；正常浏览时手滑点不到 3 次。
   路径必须是相对的（'teacher.html'），GitHub Pages 项目站用 '/teacher.html' 会 404。 */
let taps = [];
keyEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  const now = Date.now();
  taps = taps.filter(t => now - t < 1200);   // 只保留 1.2 秒内的
  taps.push(now);
  if (taps.length >= 3){
    taps = [];
    location.href = 'teacher.html';
    return;
  }
  keyEl.classList.add('armed');
  setTimeout(() => { if (Date.now() - taps[taps.length - 1] >= 600) keyEl.classList.remove('armed'); }, 700);
});

/* bfcache：从教师端按「返回」回来时，挂起的定时器链会一次性炸出来 */
addEventListener('pageshow', e => { if (e.persisted) init(false); });

init(false);
</script>
